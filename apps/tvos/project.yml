name: PatreonTV

# Regenerate the .xcodeproj with:  brew install xcodegen && xcodegen generate
options:
  bundleIdPrefix: com.patreontv
  deploymentTarget:
    tvOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true
  generateEmptyDirectories: true
  # Modern Xcode folder-sync: adding .swift files to disk automatically includes them.
  # Requires Xcode 15+.
  minimumXcodeGenVersion: "2.42.0"
  # Sets LastUpgradeCheck so Xcode stops prompting "Update to recommended
  # settings". Bump when upgrading Xcode.
  xcodeVersion: "26.6"

settings:
  base:
    SWIFT_VERSION: "5.9"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    MARKETING_VERSION: "2.2.0"
    CURRENT_PROJECT_VERSION: "17"

targets:
  PatreonTV:
    type: application
    platform: tvOS
    deploymentTarget: "17.0"
    sources:
      - path: PatreonTV/Sources
      # Resources (asset catalog) must live under `sources` — XcodeGen has no
      # `resources:` key, so listing it there was silently ignored and the
      # catalog (app icon + in-app logos) never compiled into the app.
      - path: PatreonTV/Resources
    info:
      path: PatreonTV/Info.plist
      properties:
        CFBundleDisplayName: PatreonTV
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleLocalizations:
          - en
          - es
          - pt-BR
          - fr
        # Custom URL scheme for Top Shelf deep links
        CFBundleURLTypes:
          - CFBundleURLName: com.patreontv.PatreonTV
            CFBundleURLSchemes: [patreontv]
        # Phone pairing: the sign-in screen serves a page on the local network.
        NSLocalNetworkUsageDescription: "PatreonTV shows a QR code so your phone can send your Patreon session to this Apple TV over your local network."
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            patreon.com:
              NSIncludesSubdomains: true
              NSExceptionRequiresForwardSecrecy: true
              NSExceptionMinimumTLSVersion: "TLSv1.2"
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIRequiredDeviceCapabilities:
          - arm64
        UILaunchScreen: {}
        # Apple requires the audio background mode for Picture in Picture
        # ("Audio, AirPlay, and Picture in Picture"). Without it AVKit offers no
        # PiP control at all. See PlayerHostViewController.activateAudioSession().
        UIBackgroundModes:
          - audio
    entitlements:
      path: PatreonTV/PatreonTV.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.patreontv.PatreonTV
        com.apple.security.application-groups:
          - group.com.patreontv.PatreonTV
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.patreontv.PatreonTV
        TARGETED_DEVICE_FAMILY: "3"   # 3 = Apple TV
        INFOPLIST_KEY_CFBundleDisplayName: PatreonTV
        ASSETCATALOG_COMPILER_APPICON_NAME: App Icon & Top Shelf Image
        SUPPORTS_MACCATALYST: NO
    dependencies:
      - package: Nuke
        product: Nuke
      - package: Nuke
        product: NukeUI
      - target: PatreonTVTopShelf

  PatreonTVTopShelf:
    type: tv-app-extension
    platform: tvOS
    deploymentTarget: "17.0"
    sources:
      - path: PatreonTVTopShelf
      # Shared with the main app target — one file, two targets, no drift.
      - path: PatreonTV/Sources/Services/TopShelfSnapshot.swift
    info:
      path: PatreonTVTopShelf/Info.plist
      properties:
        CFBundleDisplayName: PatreonTV Top Shelf
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.tv-top-shelf
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ContentProvider
    entitlements:
      path: PatreonTVTopShelf/PatreonTVTopShelf.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.patreontv.PatreonTV
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.patreontv.PatreonTV.TopShelf
        TARGETED_DEVICE_FAMILY: "3"

  PatreonTVTests:
    type: bundle.unit-test
    platform: tvOS
    deploymentTarget: "17.0"
    sources:
      - path: PatreonTVTests
    dependencies:
      - target: PatreonTV
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.patreontv.PatreonTVTests
        TARGETED_DEVICE_FAMILY: "3"
        GENERATE_INFOPLIST_FILE: "YES"

  PatreonTVUITests:
    type: bundle.ui-testing
    platform: tvOS
    deploymentTarget: "17.0"
    sources:
      - path: PatreonTVUITests
    dependencies:
      - target: PatreonTV
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.patreontv.PatreonTVUITests
        TARGETED_DEVICE_FAMILY: "3"
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_TARGET_NAME: PatreonTV

packages:
  Nuke:
    url: https://github.com/kean/Nuke
    # Pinned exactly: Package.resolved lives inside the gitignored generated
    # .xcodeproj, so the pin here is what makes CI builds reproducible.
    exactVersion: "12.8.0"

schemes:
  PatreonTV:
    build:
      targets:
        PatreonTV: all
        PatreonTVTopShelf: all
        PatreonTVTests: [test]
        PatreonTVUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - PatreonTVTests
        - PatreonTVUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
